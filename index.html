<script>
// V2.6 PROFILE + NEWS LIVE
async function initV26(){
  try{
    const saved = JSON.parse(localStorage.getItem('cc_profile')||'{}');
    if(saved.nama){ const el=document.getElementById('profileNama'); if(el) el.value=saved.nama; }
    if(saved.gred){ const el=document.getElementById('profileGred'); if(el) el.value=saved.gred; }
    if(saved.gaji){ const el=document.getElementById('profileGaji'); if(el) el.value=saved.gaji; autoFillGaji(saved.gaji); }
    if(saved.jabatan){ const el=document.getElementById('profileJabatan'); if(el) el.value=saved.jabatan; }
    if(saved.gred || saved.gaji){
      const stat=document.getElementById('myStats'); if(stat) stat.innerHTML=`✅ Profil aktif: ${saved.gred||''} | Gaji RM${saved.gaji||0} | ${saved.nama||''}`;
    }
  }catch(e){}
  loadNewsLiveV26();
  loadFeedbackLiveV26();
}
function autoFillGaji(gaji){
  if(!gaji) return;
  const ids=['loanGaji','gaji','gcrGaji','pencenGaji','profileGaji'];
  ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.value=gaji; });
  document.querySelectorAll('input[type=number]').forEach(inp=>{
    if(inp.placeholder && inp.placeholder.toLowerCase().includes('gaji') && !inp.value) inp.value=gaji;
  });
}
async function saveProfileV26(){
  const nama=document.getElementById('profileNama')?.value||'';
  const gred=document.getElementById('profileGred')?.value||'';
  const gaji=document.getElementById('profileGaji')?.value||'';
  const jabatan=document.getElementById('profileJabatan')?.value||'';
  if(!gred && !gaji){ alert('Isi Gred atau Gaji at least'); return; }
  const profile={nama,gred,gaji,jabatan,updated:new Date().toISOString()};
  localStorage.setItem('cc_profile', JSON.stringify(profile));
  if(window.supaClient){
    try{ await window.supaClient.from('user_profiles').insert([{device_id:localStorage.getItem('device_id')||'web_'+Math.random().toString(36).slice(2,6), nama, gred, gaji_pokok:parseInt(gaji)||0, jabatan}]); }catch(e){ console.warn('Supa profile', e.message); }
  }
  autoFillGaji(gaji);
  const stat=document.getElementById('myStats'); if(stat) stat.innerHTML=`✅ Disimpan: ${gred} | RM${gaji} | ${nama}`;
  alert('✅ Profil disimpan! Kalkulator LPPSA & GCR auto guna gaji RM'+gaji);
}
function editProfileV26(){
  ['profileNama','profileGaji','profileJabatan'].forEach(id=>{ const el=document.getElementById(id); if(el){ el.readOnly=false; el.disabled=false; el.focus(); }});
  const gredEl=document.getElementById('profileGred'); if(gredEl){ gredEl.disabled=false; }
  alert('✏️ Boleh edit sekarang - tukar je terus Save');
}
function clearProfileV26(){
  if(confirm('Padam profil?')){
    localStorage.removeItem('cc_profile');
    ['profileNama','profileGred','profileGaji','profileJabatan'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    const stat=document.getElementById('myStats'); if(stat) stat.innerHTML='❌ Belum isi profil';
  }
}
async function loadNewsLiveV26(){
  const container = document.getElementById('newsList') || document.getElementById('beritaList');
  if(!container) return;
  container.innerHTML='<div style="padding:20px;text-align:center">Loading berita live...</div>';
  if(!window.supaClient){ container.innerHTML='<div class="card">Supabase belum connect</div>'; return; }
  try{
    const {data,error}=await window.supaClient.from('news_feed').select('*').order('created_at',{ascending:false}).limit(20);
    if(error) throw error;
    if(!data || data.length===0){ container.innerHTML='<div class="card">Belum ada berita - tambah di Supabase news_feed</div>'; return; }
    container.innerHTML = data.map(n=>`
      <div class="card" style="${n.penting?'border-left:4px solid #FFD700;background:#fffbeb':''};margin-bottom:12px">
        ${n.penting?'<span style="background:#FFD700;color:#0A2A5A;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800">🔥 PENTING</span>':''}
        <div style="font-weight:800;margin:8px 0;font-size:15px">${n.title}</div>
        <div style="font-size:13px;color:#334155;line-height:1.5">${n.content}</div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
          <span style="background:#eef2ff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600">${n.category||'Umum'}</span>
          <small style="color:#94a3b8">${(n.created_at||'').slice(0,10)}</small>
        </div>
        ${n.sumber_url?`<a href="${n.sumber_url}" target="_blank" style="font-size:12px;color:#0A2A5A;display:block;margin-top:8px">📄 Sumber rasmi →</a>`:''}
      </div>
    `).join('');
  }catch(e){ container.innerHTML=`<div class="card">Gagal load berita: ${e.message}<br><small>Check Supabase news_feed table RLS policy</small></div>`; }
}
async function loadFeedbackLiveV26(){
  const fbList=document.getElementById('fbList'); const dashList=document.getElementById('dashList'); const dashStats=document.getElementById('dashStats');
  if(!fbList && !dashList) return;
  if(!window.supaClient) return;
  try{
    const {data,error}=await window.supaClient.from('feedback').select('*').order('created_at',{ascending:false}).limit(30);
    if(error) throw error;
    const html = (data||[]).map(f=>`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div><b>${f.question||f.title||'Soalan'}</b><br><small>${f.category||''} • ${f.count||1} permintaan</small></div>
        <button onclick="if(window.supaClient) window.supaClient.from('feedback').update({count:(f.count||1)+1}).eq('id',${f.id}).then(()=>loadFeedbackLiveV26())" style="background:#0A2A5A;color:#fff;border:none;padding:6px 12px;border-radius:8px">👍 ${f.count||1}</button>
      </div>
    `).join('') || '<div class="card">Belum ada feedback</div>';
    if(fbList) fbList.innerHTML=html;
    if(dashList) dashList.innerHTML=html;
    if(dashStats) dashStats.innerHTML=`Total: ${data.length} topik | ${data.reduce((s,x)=>s+(x.count||1),0)} undian`;
  }catch(e){ console.warn('Feedback load', e.message); }
}
if(!localStorage.getItem('device_id')) localStorage.setItem('device_id','web_'+Math.random().toString(36).slice(2,9));
window.addEventListener('load', ()=>{ setTimeout(initV26, 800); });

const origShowTabV26 = window.showTab;
window.showTab = function(id){
  if(origShowTabV26) origShowTabV26(id);
  if(id==='berita' || id==='news') setTimeout(loadNewsLiveV26,100);
  if(id==='feedback' || id==='dash') setTimeout(loadFeedbackLiveV26,100);
  // always clear input
  const q=document.getElementById('q'); if(q && document.activeElement!==q) { /* keep if user typing */ }
};
