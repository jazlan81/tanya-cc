1️⃣ **Bantuan Mengurus Jenazah (BMJ) - RM3000**
Untuk urus jenazah penjawat awam, pasangan, anak tanggungan yang meninggal. Ni paling laju dapat, biasa 7-14 hari lepas hantar borang.

2️⃣ **Ex Gratia Kematian Dalam Perkhidmatan - RM10k hingga RM20k**
Kalau meninggal masa masih berkhidmat (bukan bersara). Kadar ikut gred: Gred 1-20 = RM10k, Gred 21-30 = RM15k, Gred 31 ke atas / JUSA = RM20k. Rujuk PP Bil 12/2008.

3️⃣ **Ex Gratia Bencana Kerja**
Kalau cedera / hilang upaya masa bertugas, ikut Perintah Am Bab C. Kadar ikut peratus keilatan Lembaga Perubatan.

\uD83D\uDCCC Nak mohon, isi **Borang JPA.BK.B01**, attach sijil mati + IC waris, hantar ke JPA melalui HR. Jangan lewat lebih 12 bulan bro.`},{id:"bmj",keywords:["bantuan mengurus jenazah","bmj","jenazah","mengurus jenazah","bantuan jenazah","rm3000"],title:"Bantuan Mengurus Jenazah (BMJ) RM3000",apa:"BMJ RM3000 diberi untuk urusan pengebumian bila penjawat awam, pasangan, atau anak tanggungan meninggal dunia.",syarat:["Penjawat awam tetap / sementara / kontrak layak","Kematian pasangan / anak tanggungan bawah 21 tahun (belum kahwin)","Tuntutan dalam 12 bulan dari tarikh kematian"],kadar:"RM3000 sekali bayar untuk setiap kematian",dokumen:["Borang JPA.BP.BMJ01","Sijil kematian asal","Salinan IC pemohon & si mati","Surat akuan tanggungan jika anak"],sumber:"Pekeliling Perkhidmatan Bil 9/2014",jawapan:`Bro, pasal **Bantuan Mengurus Jenazah RM3000** ni simple je:

\uD83D\uDCB0 **Kadar: RM3000 terus** - bukan ansuran, sekali bayar.

✅ **Siapa layak dapat?**
- Kau sebagai penjawat awam meninggal = waris dapat
- Pasangan kau meninggal = kau dapat
- Anak tanggungan (bawah 21, belum kahwin, belajar fulltime sampai 25) meninggal = kau dapat

\uD83D\uDCC4 **Dokumen:**
- Borang JPA.BP.BMJ01 (minta kat HR)
- Sijil mati
- IC kau + si mati
- Kalau anak, surat pengesahan belajar kalau 21-25 tahun

⏰ **Proses:** Hantar dalam 12 bulan, kalau lambat burn. Biasa 2 minggu duit masuk akaun. Rujuk HR cepat.

Sumber: **PP Bil 9/2014** - ada borang siap dalam lampiran.`},{id:"exgratia-kematian",keywords:["ex gratia kematian","kematian dalam perkhidmatan","meninggal dalam perkhidmatan","rm10000","rm15000","rm20000"],title:"Ex Gratia Kematian Dalam Perkhidmatan RM10k-20k",apa:"Bayaran saguhati bila penjawat awam meninggal dunia semasa masih dalam perkhidmatan.",syarat:["Meninggal dalam perkhidmatan (belum bersara)","Lantikan tetap","Kematian bukan sebab salah laku"],kadar:"Gred 1-20: RM10k, Gred 21-30: RM15k, Gred 31 ke atas: RM20k",dokumen:["JPA.BK.B02","Laporan Ketua Jabatan","Sijil mati"],sumber:"Pekeliling Perkhidmatan Bil 12/2008",jawapan:`Ex gratia kematian dalam perkhidmatan ni bro, bukan BMJ tau, ni extra:

\uD83D\uDCB0 **Kadar ikut gred:**
- Gred 1-20 (N19, W19 etc) = **RM10,000**
- Gred 21-30 (N29, N41) = **RM15,000**
- Gred 31 ke atas / JUSA = **RM20,000**

Ni on top of BMJ RM3000 + pencen terbitan + GCR + ganjaran kalau layak. So waris boleh dapat double.

✅ **Syarat:** Meninggal masa masih berkhidmat, bukan dah pencen. Kena hantar dalam 1 tahun.

\uD83D\uDCDA **Sumber:** PP Bil 12/2008. Borang JPA.BK.B02.

Kau tanya HR, diorang ada checklist.`},{id:"exgratia-bencana",keywords:["bencana kerja","ex gratia bencana","cedera bertugas","kemalangan kerja","perintah am bab c"],title:"Ex Gratia Bencana Kerja - Perintah Am Bab C",apa:"Pampasan bila cedera / hilang upaya kekal akibat kemalangan semasa bertugas.",syarat:["Kemalangan semasa bertugas / dalam perjalanan bertugas","Disahkan Lembaga Perubatan","Peratusan keilatan 20% ke atas"],kadar:"Ikut % keilatan x gaji, max RM50k mengikut jadual",dokumen:["Laporan polis","Laporan perubatan","Borang JPA.BK.B03"],sumber:"Perintah Am Bab C",jawapan:`Bencana kerja ni kes berat bro. Kalau kau accident masa bertugas - contoh jatuh di pejabat, accident masa lawatan kerja - boleh claim ex gratia bencana.

\uD83D\uDCB0 Kadar ikut % keilatan doktor bagi. Contoh 30% hilang upaya x gaji x bulan. Jadual ada dalam **Perintah Am Bab C**.

Proses:
1. Report polis + laporan Ketua Jabatan dalam 24 jam
2. Rujuk Lembaga Perubatan untuk % keilatan
3. Isi JPA.BK.B03

Ni lain dari PERKESO tau. Penjawat awam tetap guna skim ni, bukan PERKESO.

Sumber: Perintah Am Bab C - Bab Faedah Bencana Kerja.`},{id:"medical-board",keywords:["medical board","lembaga perubatan","pencen ilat","ilat","tidak sihat"],title:"Medical Board / Pencen Ilat",apa:"Bersara sebab kesihatan tak mengizinkan, disahkan Lembaga Perubatan tak berupaya kekal.",syarat:["Disahkan Lembaga Perubatan Kerajaan","Tidak berupaya kekal jalankan tugas","Min 1 tahun berkhidmat untuk pertimbang"],kadar:"<10 tahun = ex gratia, 10-21 tahun = pencen %, >21 tahun = pencen penuh + TPSI",dokumen:["Laporan perubatan pakar","Borang JPA(B)01","Rekod cuti sakit"],sumber:"Akta Pencen 1980 Seksyen 10, Pekeliling Perkhidmatan Bil 1/2018 (TPSI)",jawapan:`Medical board ni bro, kalau kau sakit kronik tak boleh kerja dah, doktor sahkan ilat:

\uD83D\uDCCA **Kiraan ikut tahun servis:**
- **Kurang 10 tahun:** Dapat **Ex Gratia** je, bukan pencen. Kira = 10% x bulan x gaji akhir. Contoh 8 tahun (96 bln) x RM4000 = RM38,400 sekali.
- **10-21 tahun:** Dapat **pencen peratusan** + ganjaran. Formula: Pencen = bulan/600 x gaji. 15 tahun = 180/600=30% x RM4000=RM1200/bln.
- **Lebih 21 tahun:** Power bro, dapat **pencen penuh + ganjaran** dan kalau cukup syarat **TPSI 360 bulan** dikira seolah 30 tahun terus (60% max).

\uD83D\uDCA1 **TPSI 360 bulan:** Berkuatkuasa 1 Jan 2018. Kalau medical board, walaupun servis 22 tahun je, JPA boleh pertimbang genapkan 30 tahun untuk pencen. Kena mohon.

Formula tetap: Ganjaran = 7.5% x bulan x gaji akhir. Pencen max 60%.

Sumber: Akta Pencen 1980 Seksyen 10 + PP Bil 1/2018 TPSI.`},{id:"gcr-general",keywords:["gcr","gantian cuti rehat","ganjaran cuti","cuti rehat","tebus cuti"],title:"GCR - Ganjaran Wang Tunai Gantian Cuti Rehat",apa:"Bayaran tunai ganti cuti rehat yang tak sempat habis bila bersara.",syarat:["Min 10 tahun berkhidmat","Bersara wajib / pilihan / ilat","Cuti rehat terkumpul"],kadar:"Max 150 hari (SSPA 2024 jadi 180 hari), formula 1/30 x gaji akhir x hari",dokumen:["Borang JPA.GCR01","Penyata cuti HRMIS"],sumber:"Pekeliling Perkhidmatan Bil 14/2008, Pekeliling SSPA 2024",jawapan:`GCR ni duit cuti yang kau tak ambik bro, kerajaan bayar balik masa bersara:

\uD83D\uDCB0 **Formula: GCR = 1/30 x Gaji Akhir x Bil Hari**
Contoh gaji RM4500, baki 120 hari = 1/30*4500*120 = RM18,000 sekali gus!

\uD83D\uDCCF **Had:**
- Lama: max 150 hari
- **SSPA 2024 baru: max 180 hari** (naik 30 hari) - untung!

✅ **Syarat:** Kena 10 tahun servis minimum, bersara wajib/pilihan/medical board layak. Berhenti sendiri tak layak.

\uD83D\uDCC4 **Tips CC Jazlan:** Jangan burn cuti rehat kau tiap tahun, kumpul max. 25 hari setahun x 20 tahun = 500 hari tapi boleh tebus 150 (180 baru) je. Selebihnya hangus, so plan cuti elok-elok.

Sumber: PP Bil 14/2008 + SSPA 2024.`},{id:"lppsa-umum",keywords:["lppsa","pinjaman perumahan","rumah kerajaan","loan rumah"],title:"LPPSA - Pinjaman Perumahan Penjawat Awam",apa:"Pinjaman beli rumah untuk penjawat awam tetap dengan kadar 4% tetap.",syarat:["Lantikan tetap, sah jawatan","Min 1 tahun berkhidmat","Umur max 70 tahun habis bayar"],kadar:"Kadar tetap 4.0%, margin 80-100% ikut jenis",dokumen:["Borang LPPSA online","SPA","Penyata gaji 3 bulan"],sumber:"Pekeliling LPPSA Bil 1/2020",jawapan:`LPPSA ni lubuk bro untuk beli rumah:

\uD83C\uDFE0 **Kelayakan:**
- Margin dulu 80% je, sekarang **90-100%** ikut jenis rumah & gaji
- Tempoh max **35 tahun** atau sampai umur 70, mana dulu
- Kadar **4.0% tetap** - tak naik macam bank, steady
- Ansuran + hutang lain tak lebih **60% gaji pokok**

\uD83D\uDD01 **Second loan:** Boleh! Syarat loan pertama selesai bayar atau baki kurang 50% dan rumah pertama dah dapat CF, atau jual rumah pertama. Ramai tak tahu boleh 2 kali.

\uD83D\uDCA1 Kira cepat: Rumah RM400k, loan 90% = RM360k, 35 tahun 4% = ~RM1580/bln. Kena gaji pokok RM2634 minimum untuk lepas 60% rule.

Sumber: LPPSA - lppsa.gov.my. Mohon online je sekarang.`},{id:"pencen-biasa",keywords:["pencen biasa","pencen wajib","umur 60","bersara wajib","kira pencen"],title:"Pencen Biasa Umur 60",apa:"Pencen bulanan bila bersara wajib umur 60 tahun.",syarat:["Min 10 tahun berkhidmat","Umur 60 wajib","Lantikan berpencen"],kadar:"Pencen = bulan/600 x gaji akhir, max 60% (360 bulan)",dokumen:["Borang JPA(P)01","Kad pengenalan","Penyata perkhidmatan"],sumber:"Akta Pencen 1980",jawapan:`Pencen wajib umur 60 bro, ni standard:

\uD83D\uDCCA **Formula power:**
- **Pencen = Bulan Berkhidmat / 600 x Gaji Akhir**
Max 60% = 360 bulan (30 tahun). Lebih 30 tahun pun tetap 60% max.
- **Ganjaran = 7.5% x Bulan x Gaji Akhir** sekali gus

Contoh: 30 tahun = 360/600=60% x RM5000 = **RM3000 sebulan pencen** + ganjaran 7.5% x 360 x 5000 = **RM135,000** sekali!

Kalau 25 tahun = 300/600=50% je.

\uD83D\uDCA1 **TPSI 360 bln:** Sejak 2018, walaupun kau 22 tahun je tapi medical board, boleh consider 30 tahun. Tapi kalau cukup 30 tahun memang auto max 60%.

Sumber: Akta Pencen 1980.`},{id:"pencen-terbitan",keywords:["pencen terbitan","pencen balu","pencen duda","pencen anak","waris"],title:"Pencen Terbitan, Balu & Anak",apa:"Pencen untuk waris bila pesara meninggal.",syarat:["Pesara meninggal","Pasangan kahwin sah","Anak bawah 21 / OKU"],kadar:"Balu/duda 100% pencen pesara, anak 100% dibahagi",dokumen:["Sijil mati","Sijil nikah","Surat beranak anak"],sumber:"Akta Pencen 1980 Seksyen 14",jawapan:`Pencen terbitan ni untuk keluarga kalau pesara meninggal:

\uD83D\uDC69‍❤️‍\uD83D\uDC68 **Pencen balu/duda:** Dapat **100% pencen pesara** yang meninggal. Contoh pesara dapat RM2000, balu sambung dapat RM2000 seumur hidup selagi tak kahwin lain.

\uD83D\uDC76 **Pencen anak:**
- Bawah 21 tahun & belum kahwin = layak
- Kalau belajar fulltime, sampai 25 tahun
- Anak OKU = seumur hidup
- Kalau ramai anak, 100% pencen bahagi sama rata

Kalau balu kahwin lain, pencen terbitan stop, pindah ke anak.

\uD83D\uDCC4 Dokumen: Sijil mati, sijil nikah, surat beranak.

Sumber: Akta Pencen 1980 Seksyen 14. Waris kena mohon di KWAP dalam 12 bulan.`},{id:"pilihan-bersara",keywords:["bersara pilihan","pilihan 55","pilihan 56","pilihan 58","umur bersara"],title:"Umur Persaraan Pilihan 55/56/58/60",apa:"Pilihan bersara awal sebelum wajib 60 tahun.",syarat:["Min 10 tahun berkhidmat untuk pencen","Umur 40 ke atas untuk pilihan 55","Dapat kelulusan Ketua Jabatan"],kadar:"Pencen kira ikut bulan sebenar, tiada penalti sejak 2012",dokumen:["Borang JPA(S)01","Surat permohonan"],sumber:"Pekeliling Perkhidmatan Bil 3/2012",jawapan:`Bersara pilihan bro, kau boleh pilih umur:

\uD83C\uDFAF **Pilihan umur:** 55, 56, 58 atau 60. Ramai pilih 58 sekarang sebab nak rehat awal.

✅ **Syarat:** Cukup 10 tahun servis untuk layak pencen. Kalau bawah 10 tahun, dapat ex gratia je. Tak ada penalti potong pencen dah sejak 2012, kira ikut bulan sebenar je.

Contoh kau 25 tahun servis bersara umur 58: 25x12=300 bln /600 = 50% x gaji akhir.

Beza dengan wajib 60: Ganjaran & GCR kira sama, cuma pencen mula awal.

\uD83D\uDCA1 Tips: Kalau nak 60% max (30 tahun), pastikan cukup 30 tahun servis, bukan umur je. Kadang orang umur 55 tapi servis 32 tahun dah max 60%.

Sumber: PP Bil 3/2012 - Persaraan Pilihan.`},{id:"cuti-bersalin",keywords:["cuti bersalin","bersalin","cuti 98 hari","sspa bersalin","cuti mengandung"],title:"Cuti Bersalin 98 Hari SSPA 2024",apa:"Cuti bersalin untuk penjawat awam wanita.",syarat:["Perempuan, mengandung","Lantikan tetap / kontrak"],kadar:"98 hari bergaji penuh (SSPA 2024), dulu 60/90 hari",dokumen:["Sijil sakit / surat doktor"],sumber:"Pekeliling Perkhidmatan SSPA Bil 1/2024",jawapan:`Cuti bersalin sekarang power bro, **SSPA 2024 bagi 98 hari** bergaji penuh!

Sekarang: **98 hari** terus, selari dengan pindaan Akta Kerja.

✅ Boleh start 14 hari awal dari tarikh jangka bersalin.
✅ Kalau keguguran selepas 28 minggu pun layak 98 hari.
✅ Suami dapat **Cuti Isteri Bersalin 7 hari** (ada cadangan naik 15 hari).

Sumber: Pekeliling SSPA 2024. Mohon via HRMIS je.`},{id:"sspa-gaji",keywords:["sspa","gaji baru","kenaikan gaji","sspa 2024","pelarasan gaji","15 peratus"],title:"SSPA 2024 - Kenaikan Gaji 15%",apa:"Sistem Saraan Perkhidmatan Awam baru ganti SSM.",syarat:["Semua penjawat awam","Berkuatkuasa 1 Dis 2024 fasa 1"],kadar:"Kenaikan 15% (8% fasa 1 2024, 7% fasa 2 2026)",dokumen:["Pekeliling SSPA","Penyata gaji baru"],sumber:"Pekeliling Perkhidmatan SSPA 2024",jawapan:`SSPA 2024 ni game changer bro, gaji naik **15% total**:

\uD83D\uDCB0 **Pecahan:**
- Fasa 1: 1 Dis 2024 = **8% naik**
- Fasa 2: 1 Jan 2026 = **7% lagi**
Total 15% dari gaji SSM lama.

Contoh gaji RM3000 SSM:
- Lepas fasa 1: RM3240
- Lepas fasa 2: RM3450 (lebih kurang, ikut jadual baru)

✅ **Impact ke pencen:** Gaji akhir naik = pencen & ganjaran naik sekali! GCR pun naik sebab 1/30 x gaji baru.
✅ **Cuti:** GCR max naik 150 ke **180 hari**, cuti bersalin 98 hari.

Sumber: Pekeliling SSPA 2024 - jpa.gov.my. Check penyata gaji Dis 2024 kau.`},{id:"formula-pencen",keywords:["formula pencen","kira pencen","1/600","360 bulan","60 peratus"],title:"Formula Pencen & Ganjaran",apa:"Formula rasmi JPA kira pencen.",syarat:[],kadar:"Pencen max 60%, Ganjaran 7.5%",dokumen:[],sumber:"Akta Pencen 1980",jawapan:`Ni formula keramat bro, hafal ni kau power:

- Bulan = Tahun x 12
- Max 60% = 360 bulan (30 tahun). Lebih 30 tahun pun 60% max.

Contoh: 22 tahun = 264 bln /600 = 44% x RM4500 = **RM1980/bln**

\uD83D\uDCB0 **GANJARAN SEKALIGUS:**
**Ganjaran = 7.5% x Bulan x Gaji Akhir**
Contoh 22 tahun: 0.075 x 264 x 4500 = **RM89,100** sekali!

\uD83D\uDCA1 **TPSI 360:** Kalau medical board kurang 30 tahun tapi cukup syarat, dikira 360 bln terus = 60% max.

Sumber: Akta Pencen 1980.`},{id:"cuti-rehat",keywords:["cuti rehat","cuti tahunan","crk","cuti"],title:"Cuti Rehat Tahunan",apa:"Cuti tahunan penjawat awam.",syarat:["Lantikan tetap","Cukup tempoh perkhidmatan"],kadar:"25 hari (<10 tahun), 30 hari (>10 tahun), 35 hari (JUSA)",dokumen:["Mohon HRMIS"],sumber:"Perintah Am Bab C",jawapan:`Cuti rehat bro, ni hak kau:

Sumber: Perintah Am Bab C.`},{id:"lppsa-second",keywords:["second loan","pinjaman kedua","lppsa kedua","loan kedua"],title:"LPPSA Second Loan - Pinjaman Kedua",apa:"Pinjaman kedua LPPSA untuk rumah kedua.",syarat:["Pinjaman pertama selesai / baki <50%","Rumah pertama ada CF / dijual","Gaji lepas 60%"],kadar:"Sama 4%, margin 80-100%",dokumen:["Penyata baki LPPSA pertama","SPA rumah kedua"],sumber:"Garis Panduan LPPSA 2023",jawapan:`Second loan LPPSA boleh bro, ramai tak tahu:

Sumber: Garis Panduan LPPSA 2023 - check lppsa.gov.my.`},{id:"kwap",keywords:["kwap","pesara","kad pesara","pencen kwap"],title:"KWAP & Kad Pesara",apa:"Kumpulan Wang Persaraan urus pencen.",syarat:["Pesara kerajaan"],kadar:"Pencen masuk tiap 25hb",dokumen:["Kad pesara"],sumber:"Akta KWAP 2007",jawapan:`Lepas bersara, KWAP yang bayar pencen kau bro, bukan JPA dah:

Sumber: Perintah Am Bab C - CTG.`},{id:"pencen-anak",keywords:["pencen anak","anak yatim","pencen anak berapa lama"],title:"Pencen Anak Yatim",apa:"Pencen untuk anak bila ibu/bapa pesara meninggal.",syarat:["Anak bawah 21 belum kahwin","Belajar fulltime sampai 25","OKU seumur hidup"],kadar:"100% pencen bahagi sama rata anak-anak",dokumen:["Surat beranak","Surat belajar"],sumber:"Akta Pencen 1980 Seksyen 15",jawapan:`Pencen anak ni waris bro:

Sumber: Akta Pencen 1980 Seksyen 15. Mohon di KWAP.`},{id:"borang-jpa",keywords:["borang jpa","borang pencen","jpa.bk","borang ex gratia"],title:"Borang-Borang Penting JPA",apa:"Senarai borang untuk urusan pencen & ex gratia.",syarat:[],kadar:"",dokumen:[],sumber:"Portal JPA",jawapan:`Borang penting kau kena simpan bro:

 Am Bab C."},{id:"pencen-pilihan",keywords:["pencen pilihan","bersara pilihan kiraan"],title:"Pencen Pilihan Kiraan",apa:"Kiraan pencen pilihan",syarat:[],kadar:"",dokumen:[],sumber:"PP Bil 3/2012",jawapan:"Pencen pilihan kira sama je formula: Bulan/600 x gaji akhir. Takde penalti dah. Beza cuma kau dapat awal. Contoh 23 tahun = 276/600=46% x gaji. Ganjaran pun sama 7.5% x bulan x gaji. So kalau nak bersara umur 55 pun boleh asal cukup 10 tahun servis untuk pencen. Sumber: PP Bil 3/2012."},{id:"elaun",keywords:["elaun","itka","cola","epw"],title:"Elaun Penjawat Awam",apa:"Elaun tambahan",syarat:[],kadar:"",dokumen:[],sumber:"Pekeliling Elaun",jawapan:"Elaun bro: ITKA (Imbuhan Tetap Keraian Awam) RM300 untuk Gred 41 ke bawah, COLA ikut kawasan RM200-350, EPW RM200, Bantuan Sara Hidup RM300 SSPA. Tapi elaun ni tak kira untuk pencen, gaji akhir je kira. SSPA naikkan elaun sikit. Sumber: Pekeliling Elaun SSPA."},{id:"perubatan",keywords:["perubatan percuma","rawatan percuma","gl","jaminan letter"],title:"Perubatan Percuma & GL",apa:"Rawatan percuma hospital kerajaan",syarat:["Penjawat awam & tanggungan"],kadar:"Wad kelas 1 percuma",dokumen:["GL via HRMIS"],sumber:"Perintah Am Bab F",jawapan:"Kau penjawat awam bro, rawatan hospital kerajaan free, wad kelas 1 free untuk kau, pasangan, anak. Kena mohon GL via HRMIS, cepat je. Swasta tak cover. Pesara pun free guna kad pesara. Sumber: Perintah Am Bab F."},{id:"kad-pesara",keywords:["kad pesara","pesara kerajaan"],title:"Kad Pesara",apa:"Kad pengenalan pesara",syarat:[],kadar:"",dokumen:[],sumber:"KWAP",jawapan:"Kad pesara dapat lepas bersara, buat di KWAP / Pesara online. Guna untuk rawatan free, diskaun pengangkutan. Kalau hilang boleh buat baru RM20. Sumber: KWAP."},{id:"cuti-kecemasan",keywords:["cuti kecemasan","cuti 3 hari","crk"],title:"Cuti Rehat Khas & Kecemasan",apa:"CRK",syarat:[],kadar:"Max 15 hari kumpul setahun",dokumen:[],sumber:"Perintah Am Bab C",jawapan:"CRK ni cuti rehat khas bila kau kerja lebih masa, kum
